spring:
  datasource:
    url: jdbc:h2:mem:hamm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

hamm:
  jwt:
    secret: test-only-secret-key-not-for-production-use-minimum-256-bits-long
    expiration-ms: 3600000
